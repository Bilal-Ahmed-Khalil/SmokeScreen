<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <title>Login - Smokescreen</title>
</head>
<body class="login-page">
    <div class="login-card shadow-lg animated fadeInUp">
        <div class="text-center mb-4">
            <img src="/static/images/LOGO.png" alt="Smokescreen Logo" style="max-width: 120px;" class="mb-3">
            <h3 class="header-glow fw-bold">System Access</h3>
            <p class="text-info small opacity-75">Deception Units</p>
        </div>

        <form method="POST" action="/">
            {% if error %}
                <div class="alert alert-danger py-2 small bg-danger bg-opacity-10 border-danger text-danger text-center">
                    {{ error }}
                </div>
            {% endif %}

            <div class="mb-3">
                <label for="username" class="form-label">USERNAME</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="admin_user" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">PASSWORD</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="login-btn-wrapper">
                <button type="submit" class="btn-moving-border">Authorize Login</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <small class="text-white-50">© 2026 Smokescreen | <a href="#" class="text-info text-decoration-none">Help Desk</a></small>
        </div>
    </div>
</body>
</html>
