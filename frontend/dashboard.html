<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LMS Pro - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white p-6 flex flex-col fixed h-full z-20">
        <h1 class="text-2xl font-bold text-indigo-400 mb-10">LMS Pro</h1>
        <nav class="flex-1">
            <ul class="space-y-2">
                <li onclick="backToGrid()" class="p-3 rounded-lg hover:bg-slate-800 cursor-pointer transition flex items-center gap-3">
                    <span>📚</span> My Courses
                </li>
                <li onclick="showAssignmentsView()" class="p-3 rounded-lg hover:bg-slate-800 cursor-pointer transition flex items-center gap-3">
                    <span>📝</span> Assignments
                </li>
                <li id="admin-nav" onclick="showAdminPanel()" class="hidden p-3 rounded-lg bg-red-900/20 hover:bg-red-800 text-red-200 cursor-pointer transition flex items-center gap-3">
                    <span>🛡️</span> Admin Panel
                </li>
            </ul>
        </nav>
        <div class="pt-4 border-t border-slate-700">
            <div id="user-info" class="mb-4 px-2 text-xs text-slate-400 italic"></div>
            <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded-lg font-bold transition">Logout</button>
        </div>
    </aside>

    <main class="ml-64 flex-1 p-10 overflow-y-auto">
        
        <div id="course-grid-container">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Available Courses</h2>
                <div class="flex gap-3">
                    <button id="teacher-student-btn" onclick="toggleStudentModal(true, 'student')" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg font-bold shadow-md transition">
                        + Add Student
                    </button>
                    <button id="teacher-add-btn" onclick="toggleModal(true)" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-bold shadow-md transition">
                        + New Course
                    </button>
                </div>
            </div>
            <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </div>

        <div id="course-detail" class="hidden">
            <button onclick="backToGrid()" class="text-indigo-600 font-bold mb-6 hover:underline flex items-center gap-2">
                ← Back to Courses
            </button>
            <h2 id="detail-title" class="text-4xl font-extrabold mb-8 text-gray-900 border-b pb-4"></h2>
            
            <div id="teacher-content-form" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-8">
                <h3 class="font-bold mb-4 text-xl text-indigo-800">Upload Weekly Lesson</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                    <input type="number" id="wk-num" placeholder="Week #" class="border p-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-400">
                    <input type="file" id="wk-file" class="md:col-span-3 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
                <textarea id="wk-content" placeholder="Enter lesson notes and instructions..." class="w-full border p-4 rounded-xl mb-4 h-32 outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
                <button onclick="saveWeeklyContent()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-bold w-full md:w-auto transition">Publish Week Content</button>
            </div>

            <div id="weeks-list" class="space-y-8">
                </div>

            <div id="submissions-area" class="hidden mt-16 border-t pt-10">
                <h3 class="font-bold text-2xl mb-6 text-gray-800">Student Submissions</h3>
                <div id="subs-list" class="bg-white rounded-2xl shadow-sm overflow-hidden border">
                    </div>
            </div>
        </div>

        <div id="assignment-view" class="hidden">
            <h2 class="text-3xl font-bold text-gray-800 mb-8">All Pending Assignments</h2>
            <div id="assignment-master-list" class="space-y-4">
                </div>
        </div>

        <div id="admin-view" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800 text-red-700">🛡️ User Management</h2>
                <button onclick="toggleStudentModal(true, 'teacher')" class="bg-slate-800 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-black transition">
                    + Register New Teacher
                </button>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="p-4 font-bold text-slate-600 uppercase text-xs">Email</th>
                            <th class="p-4 font-bold text-slate-600 uppercase text-xs">Role</th>
                            <th class="p-4 font-bold text-slate-600 uppercase text-xs">Enrolled By</th>
                            <th class="p-4 text-right font-bold text-slate-600 uppercase text-xs">Action</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="divide-y divide-gray-100 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-student" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
            <h3 id="modal-user-title" class="text-2xl font-bold mb-6 text-gray-800">Register User</h3>
            <form id="signup-form" class="space-y-4">
                <input type="email" id="reg-email" placeholder="Email Address" class="w-full border p-4 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500" required>
                <input type="password" id="reg-password" placeholder="Temporary Password" class="w-full border p-4 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500" required>
                <input type="hidden" id="reg-role" value="student">
                
                <div class="flex justify-end gap-3 pt-6">
                    <button type="button" onclick="toggleStudentModal(false)" class="text-gray-500 font-bold px-4 hover:text-gray-700">Cancel</button>
                    <button type="submit" class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-emerald-700 transition">Complete Registration</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-course" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
            <h3 class="text-2xl font-bold mb-6 text-gray-800">Create New Course</h3>
            <input type="text" id="new-course-title" placeholder="Course Title" class="w-full border p-4 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-indigo-500">
            <textarea id="new-course-desc" placeholder="Course Description..." class="w-full border p-4 rounded-xl mb-6 h-24 outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            <div class="flex justify-end gap-3">
                <button onclick="toggleModal(false)" class="text-gray-500 font-bold px-4">Cancel</button>
                <button onclick="submitNewCourse()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">Create Course</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
