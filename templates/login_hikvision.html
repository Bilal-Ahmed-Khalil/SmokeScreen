<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>OneHikID | Secure Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap');

        :root {
            --hik-red: #D7150E;
            --hik-dark: #333333;
            --hik-grey: #666666;
            --bg-light: #f4f7f9;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Open Sans', sans-serif;
            height: 100vh;
            margin: 0;
            /* Subtle blueprint or tech background pattern for realism */
            background-image: radial-gradient(#d1d1d1 0.5px, transparent 0.5px);
            background-size: 20px 20px;
        }

        .container {
            background-color: #fff;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            width: 850px;
            max-width: 100%;
            min-height: 500px;
            display: flex;
        }

        /* Form Side */
        .form-side {
            width: 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--hik-dark);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--hik-grey);
            margin-bottom: 30px;
        }

        input {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 14px 15px;
            margin: 10px 0;
            width: 100%;
            border-radius: 2px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--hik-red);
        }

        button {
            border-radius: 2px;
            border: none;
            background-color: var(--hik-red);
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            padding: 14px;
            margin-top: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #b3120c;
        }

        .footer-text {
            margin-top: auto;
            font-size: 10px;
            color: #aaa;
            line-height: 1.4;
        }

        /* Branding/Visual Side */
        .overlay-side {
            width: 50%;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
            padding: 40px;
        }

        /* The Red/Grey Logo Style */
        .logo-text {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }

        .logo-text .red { color: var(--hik-red); }
        .logo-text .grey { color: #ccc; }

        .device-info {
            font-size: 12px;
            color: #888;
            border-top: 1px solid #333;
            padding-top: 15px;
            margin-top: 15px;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 5px #2ecc71;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-side">
        <h1>Welcome Back</h1>
        <p class="subtitle">Please enter your credentials to access the video management system.</p>
        
        <form action="/" method="post" style="display: flex; flex-direction: column;">
            <input type="text" name="username" placeholder="OneHikID / Email / Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <div style="text-align: right; margin-top: 5px;">
                <a href="#" style="color: var(--hik-red); font-size: 12px; text-decoration: none;">Forgot Password?</a>
            </div>
            <button type="submit">LOGIN</button>
        </form>

        <p class="footer-text">
            © 2026 Hangzhou Hikvision Digital Technology Co., Ltd.<br>
            All Rights Reserved. | Firmware: v5.5.800 build 260208
        </p>
    </div>

    <div class="overlay-side">
        <div class="logo-text">
            <span class="red">HIK</span><span class="grey">VISION</span><sup style="font-size: 12px; vertical-align: top;">®</sup>
        </div>
        <p style="font-weight: 300; letter-spacing: 1px; color: #eee;">ONE<span style="font-weight: 700;">HIK</span>ID</p>
        
        <div class="device-info">
            <span class="status-dot"></span> System Status: encrypted_connect<br>
            <span style="font-family: monospace; color: #555;">ID: DARKFIGHTER-IR-SPEED-DOME</span>
        </div>
    </div>
</div>

</body>
</html>
