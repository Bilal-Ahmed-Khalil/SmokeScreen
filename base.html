<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/scripts.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>{{ title }} SmokeScreen</title>
    
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.85);
            --accent-blue: #00f2ff;
        }

        body {
            background: url('/static/images/background1.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        /* --- Header / Navbar Customization --- */
        .navbar {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem 1rem;
        }

        .navbar-brand img {
            filter: drop-shadow(0 0 5px rgba(0, 242, 255, 0.5));
            transition: transform 0.3s ease;
        }

        .navbar-brand:hover img {
            transform: scale(1.05);
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7) !important;
            font-weight: 500;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            margin: 0 5px;
        }

        .nav-link:hover {
            color: var(--accent-blue) !important;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .btn-logout {
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #ff4d4d !important;
            border-radius: 8px;
            padding: 5px 15px !important;
        }

        .btn-logout:hover {
            background: rgba(220, 53, 69, 0.1);
            border-color: #ff4d4d;
        }

        /* --- Content Area --- */
        .main-wrapper {
            flex: 1; /* Pushes footer to the bottom */
            padding-bottom: 80px; /* Space for fixed footer */
        }

        /* --- Footer Customization --- */
        footer {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding: 15px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 0.85rem;
            z-index: 1000;
        }

        .footer-link {
            color: var(--accent-blue);
            text-decoration: none;
            margin-left: 10px;
        }

        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/dashboard">
                    <img src="/static/images/LOGO.png" alt="Logo" style="height: 45px;">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/low"><i class="bi bi-shield-slash me-1"></i> Low</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/medium"><i class="bi bi-shield-shaded me-1"></i> Medium</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/high"><i class="bi bi-shield-lock me-1"></i> High</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link btn-logout" href="/logout">
                                <i class="bi bi-box-arrow-right me-1"></i> Terminate Session
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-wrapper">
        <div class="container mt-4">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <span>&copy; 2026 Smokescreen Deception System</span>
            <span class="mx-2">|</span>
            <span class="text-info small">Node Status: <i class="bi bi-circle-fill text-success" style="font-size: 8px;"></i> Online</span>
            <a href="#" class="footer-link">Documentation</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
