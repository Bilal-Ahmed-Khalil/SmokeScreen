<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LMS - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center p-4">
    <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600">LMS Portal</h1>
            <p class="text-slate-500 mt-2">Sign in to access your dashboard</p>
        </div>
        <form id="login-form" class="space-y-6">
            <input id="email" type="email" placeholder="Email" class="w-full p-3 border rounded-xl outline-none" required>
            <input id="password" type="password" placeholder="Password" class="w-full p-3 border rounded-xl outline-none" required>
            <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold hover:bg-indigo-700">Sign In</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
