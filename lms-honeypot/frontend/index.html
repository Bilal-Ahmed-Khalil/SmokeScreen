<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Portal - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animation for the honeypot "Loading" state */
        @keyframes pulse-indigo {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading-pulse { animation: pulse-indigo 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white shadow-lg mb-4">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path>
                    <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">LMS Cloud</h1>
            <p class="text-gray-500 mt-2 font-medium">Enterprise Learning Management System</p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-10">
            <form id="login-form" onsubmit="return false;" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-bold text-gray-700 mb-2">Institutional Email</label>
                    <input type="email" id="email" required 
                        class="block w-full px-4 py-4 rounded-xl border border-gray-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 transition-all outline-none bg-gray-50" 
                        placeholder="admin@lms.com">
                </div>

                <div>
                    <div class="flex justify-between mb-2">
                        <label for="password" class="text-sm font-bold text-gray-700">Password</label>
                        <a href="#" class="text-xs font-bold text-indigo-600 hover:text-indigo-800">Forgot?</a>
                    </div>
                    <input type="password" id="password" required 
                        class="block w-full px-4 py-4 rounded-xl border border-gray-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 transition-all outline-none bg-gray-50" 
                        placeholder="••••••••">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="remember" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                    <label for="remember" class="ml-2 text-sm text-gray-500 font-medium">Keep me signed in</label>
                </div>

                <button type="submit" id="login-btn" 
                    class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-lg shadow-lg shadow-indigo-200 hover:bg-indigo-700 active:scale-[0.98] transition-all">
                    Sign In
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-gray-100 text-center">
                <p class="text-sm text-gray-500 font-medium">
                    New academic session? <a href="register.html" class="text-indigo-600 font-bold hover:underline">Apply for Access</a>
                </p>
            </div>
        </div>

        <div class="mt-8 flex justify-center gap-6 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
            <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                System Operational
            </div>
            <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-gray-300"></span>
                v4.2.0-Stable
            </div>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
